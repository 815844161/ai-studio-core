name: Build AI War Room

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Download One API binary
        run: |
          $url = "https://github.com/songquanpeng/one-api/releases/download/v0.6.10/one-api.exe"
          $dest = "src-tauri/binaries/one-api-x86_64-pc-windows-msvc.exe"
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries"
          Invoke-WebRequest -Uri $url -OutFile $dest
          Write-Host "Downloaded One API to $dest"
          (Get-Item $dest).Length

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.BUILD_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI作战室 ${{ github.ref_name }}"
          releaseBody: |
            ## AI作战室 v0.3.0 更新内容
            
            ### 修复
            - One API网关自动启动（sidecar权限修复）
            - 网关端口固定3000（被占用时自动回退）
            - 防止重复启动网关（原子锁）
            - 退出应用时自动关闭One API子进程
            - 关闭窗口最小化到托盘而非退出
            
            ### 新增
            - One API崩溃自动重启（最多3次）
            - 托盘菜单：显示窗口/重启网关/退出
            - 启动页右下角显示版本号
            - 北京时间日志
            - CSP安全策略
            
            ### 默认配置
            - 首次启动自动初始化，默认账号 root / 123456
            - 建议首次登录后立即修改密码
          releaseDraft: false
          prerelease: false
