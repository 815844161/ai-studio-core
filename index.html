<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI作战室</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #0d1117; }

  /* 启动画面 */
  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 100;
    background: linear-gradient(135deg, #0d1117 0%, #1a2332 50%, #0d1117 100%);
    transition: opacity 0.5s ease;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }

  .logo-container {
    width: 96px; height: 96px; border-radius: 22px;
    background: linear-gradient(135deg, #1a2332, #243044);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(0, 212, 255, 0.15);
    margin-bottom: 28px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(0, 212, 255, 0.15); }
    50% { box-shadow: 0 8px 48px rgba(0, 212, 255, 0.3); }
  }

  .logo-dots { display: flex; gap: 8px; }
  .logo-dots span {
    width: 12px; height: 12px; border-radius: 50%;
    background: #00d4ff; animation: bounce 1.4s ease-in-out infinite;
  }
  .logo-dots span:nth-child(2) { animation-delay: 0.2s; }
  .logo-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  .app-title { color: #e6edf3; font-size: 22px; font-weight: 600; margin-bottom: 8px; letter-spacing: 2px; }
  .app-subtitle { color: #7d8590; font-size: 13px; margin-bottom: 32px; }

  .status-bar {
    display: flex; align-items: center; gap: 8px;
    color: #7d8590; font-size: 13px;
  }
  .spinner {
    width: 16px; height: 16px; border: 2px solid #21262d;
    border-top-color: #00d4ff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 错误画面 */
  #error-screen {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 200;
    background: #0d1117; color: #e6edf3; padding: 40px; text-align: center;
  }
  #error-screen.show { display: flex; }
  .error-icon { font-size: 48px; margin-bottom: 16px; }
  .error-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #f85149; }
  .error-msg { color: #7d8590; font-size: 14px; max-width: 400px; line-height: 1.6; margin-bottom: 24px; }
  .retry-btn {
    padding: 10px 28px; background: #238636; color: #fff; border: none;
    border-radius: 8px; font-size: 14px; cursor: pointer; transition: background 0.2s;
  }
  .retry-btn:hover { background: #2ea043; }

  /* WebView */
  #gateway-frame {
    width: 100%; height: 100%; border: none; display: none; background: #fff;
  }
  #gateway-frame.show { display: block; }
</style>
</head>
<body>

<!-- 启动画面 -->
<div id="splash">
  <div class="logo-container">
    <div class="logo-dots"><span></span><span></span><span></span></div>
  </div>
  <div class="app-title">AI作战室</div>
  <div class="app-subtitle">多模型AI网关 · 本地部署</div>
  <div class="status-bar">
    <div class="spinner"></div>
    <span id="status-text">正在启动网关服务...</span>
  </div>
</div>

<!-- 错误画面 -->
<div id="error-screen">
  <div class="error-icon">⚠️</div>
  <div class="error-title">网关启动失败</div>
  <div class="error-msg" id="error-msg">请检查端口是否被占用，或重新启动应用。</div>
  <button class="retry-btn" onclick="location.reload()">重新启动</button>
</div>

<!-- One API Web界面 -->
<iframe id="gateway-frame" src="about:blank"></iframe>

<script type="module">
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;

  const splash = document.getElementById('splash');
  const frame = document.getElementById('gateway-frame');
  const errorScreen = document.getElementById('error-screen');
  const statusText = document.getElementById('status-text');
  const errorMsg = document.getElementById('error-msg');

  let readyTimeout;

  async function init() {
    try {
      statusText.textContent = '正在启动网关服务...';

      // 监听网关就绪
      await listen('gateway-ready', (event) => {
        clearTimeout(readyTimeout);
        const url = event.payload;
        console.log('Gateway ready:', url);
        statusText.textContent = '网关就绪，正在加载界面...';
        frame.src = url;
      });

      // 兜底就绪
      await listen('gateway-ready-timeout', (event) => {
        clearTimeout(readyTimeout);
        const url = event.payload;
        console.log('Gateway ready (timeout fallback):', url);
        frame.src = url;
      });

      // 监听错误
      await listen('gateway-error', (event) => {
        console.error('Gateway error:', event.payload);
        errorMsg.textContent = String(event.payload);
        splash.classList.add('hidden');
        errorScreen.classList.add('show');
      });

      // 监听stderr日志（调试用）
      await listen('gateway-stderr', (event) => {
        const text = String(event.payload);
        if (text.includes('FATAL') || text.includes('panic')) {
          console.error('Gateway fatal:', text);
          errorMsg.textContent = text.substring(0, 300);
          splash.classList.add('hidden');
          errorScreen.classList.add('show');
        }
      });

      // 15秒超时保护
      readyTimeout = setTimeout(() => {
        if (!frame.src || frame.src === 'about:blank') {
          errorMsg.textContent = '网关启动超时（15秒），请检查端口占用或重新启动应用。';
          splash.classList.add('hidden');
          errorScreen.classList.add('show');
        }
      }, 15000);

      // 启动网关
      const result = await invoke('start_gateway');
      console.log('Start result:', result);

    } catch (err) {
      console.error('Init failed:', err);
      errorMsg.textContent = String(err);
      splash.classList.add('hidden');
      errorScreen.classList.add('show');
    }
  }

  // iframe加载完成后隐藏splash
  frame.addEventListener('load', () => {
    if (frame.src && frame.src !== 'about:blank') {
      setTimeout(() => {
        splash.classList.add('hidden');
        frame.classList.add('show');
      }, 500);
    }
  });

  init();
</script>
</body>
</html>
