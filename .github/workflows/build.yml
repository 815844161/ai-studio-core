name: Build AI War Room

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Download One API binary
        run: |
          $url = "https://github.com/songquanpeng/one-api/releases/download/v0.6.10/one-api.exe"
          $dest = "src-tauri/binaries/one-api-x86_64-pc-windows-msvc.exe"
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries"
          Invoke-WebRequest -Uri $url -OutFile $dest
          Write-Host "Downloaded One API to $dest"
          (Get-Item $dest).Length

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.BUILD_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI作战室 ${{ github.ref_name }}"
          releaseBody: |
            ## AI作战室 v0.2.0 更新内容
            - 修复One API网关自动启动问题（核心修复）
            - 窗口直接嵌入One API管理界面
            - 添加系统托盘图标（最小化到托盘）
            - 首次启动自动初始化，默认账号 root / 123456
            - 安装包文件名优化
          releaseDraft: false
          prerelease: false

      - name: Rename installer
        run: |
          # 找到生成的NSIS安装包并重命名
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            $newName = "AI作战室_Setup_${{ github.ref_name }}.exe"
            Rename-Item $exe.FullName -NewName $newName
            Write-Host "Renamed to $newName"
            # 上传重命名后的文件到release
            gh release upload ${{ github.ref_name }} (Join-Path $exe.DirectoryName $newName) --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
